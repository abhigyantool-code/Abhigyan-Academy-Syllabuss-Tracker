version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - POCKETBASE_URL=${POCKETBASE_URL:-https://stracker.abhigyanintelligence.cloud/_/}
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET:-c68f9a2e1d4b8e7c5f3a0d9b8e7f6a5c4d3b2a1e0f9a8b7c6d5e4f3a2b1c0d9e}
      - ADMIN_MASTER_PASSWORD=${ADMIN_MASTER_PASSWORD:-AbhigyanAdmin2026!}
      - REQUIRE_PIN=true
      - REQUIRE_CLASS_CODE=false
